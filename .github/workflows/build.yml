name: Build GridFlow (All Platforms)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}"
          } else {
            $txt = Get-Content version_info.txt -Raw
            if ($txt -match 'prodvers=\((\d+),\s*(\d+),\s*(\d+),\s*\d+\)') {
              $ver = "v$($matches[1]).$($matches[2]).$($matches[3])"
            } else {
              $ver = "dev"
            }
          }
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Detect arch
        shell: pwsh
        run: |
          $arch = $env:PROCESSOR_ARCHITECTURE.ToLower()
          if ($arch -eq "amd64") { $arch = "x64" }
          if ($arch -eq "arm64") { $arch = "arm64" }
          echo "ARCH=$arch" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller build_win.spec --noconfirm

      - name: Rename artifact
        shell: pwsh
        run: |
          $name = "GridFlow-$env:APP_VERSION-Windows-$env:ARCH.exe"
          Rename-Item -Path dist\GridFlow.exe -NewName $name
          echo "ARTIFACT_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridFlow-${{ env.APP_VERSION }}-Windows-${{ env.ARCH }}
          path: dist/GridFlow-*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            ver=$(python3 -c 'import re;f=open("version_info.txt").read();m=re.search(r"prodvers=\((\d+),\s*(\d+),\s*(\d+)",f);print(f"v{m[1]}.{m[2]}.{m[3]}")if m else"dev"')
            echo "APP_VERSION=$ver" >> $GITHUB_ENV
          fi

      - name: Detect arch
        run: |
          arch=$(uname -m)
          echo "ARCH=$arch" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build binary
        run: pyinstaller build_linux.spec --noconfirm

      - name: Rename with platform + arch
        run: |
          name="GridFlow-$APP_VERSION-Linux-$ARCH"
          mv dist/GridFlow "dist/$name"
          chmod +x "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridFlow-${{ env.APP_VERSION }}-Linux-${{ env.ARCH }}
          path: dist/GridFlow-*

  create-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GridFlow-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 下载 / Downloads

            | 平台 | 文件 |
            |------|------|
            | 🪟 Windows | `GridFlow-${{ github.ref_name }}-Windows-x64.exe` |
            | 🐧 Linux | `GridFlow-${{ github.ref_name }}-Linux-x86_64` |

            ---

            ## 功能 / Features

            ### 数据处理
            - **✂️ 表格拆分** — 按指定字段拆分为独立文件或多个 Sheet，支持保留原表公式
            - **🔗 表格合并** — 多文件纵向合并或多 Sheet 合并为单文件
            - **🧹 数据去重** — 按指定列检测并删除重复行，可选保留首/尾
            - **🔄 格式转换** — XLSX / CSV 批量互转

            ### 数据分析
            - **🔍 数据筛选** — 按条件过滤行，支持 11 种运算符、AND/OR 组合
            - **📋 列操作** — 保留/删除/重命名/重排列序，支持简单计算列
            - **📊 透视表** — 行/列/值字段交叉聚合，计数/求和/平均/最值
            - **✅ 数据校验** — 空值检测、异常值(IQR)、类型检查、重复行检测

            ### 特性
            - 🌓 深色/浅色主题切换
            - 🌐 中英双语界面
            - 📂 拖拽导入文件
            - ⚡ openpyxl 流式读写，低内存占用
            - 🔒 完全离线，数据不上传
          files: |
            GridFlow-*
