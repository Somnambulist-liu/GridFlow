name: Build GridFlow (All Platforms)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller build_win.spec --noconfirm

      - name: Rename with platform + arch
        shell: pwsh
        run: |
          $arch = $env:PROCESSOR_ARCHITECTURE.ToLower()
          if ($arch -eq "amd64") { $arch = "x64" }
          $name = "GridFlow-Windows-${arch}.exe"
          Rename-Item -Path dist\GridFlow.exe -NewName $name
          echo "ARTIFACT_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridFlow-Windows-${{ runner.arch }}
          path: dist/GridFlow-Windows-*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .app
        run: pyinstaller build_macos.spec --noconfirm

      - name: Zip .app with platform + arch
        run: |
          arch=$(uname -m)
          zip -r "GridFlow-macOS-${arch}.zip" dist/GridFlow.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridFlow-macOS-${{ runner.arch }}
          path: GridFlow-macOS-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build binary
        run: pyinstaller build_linux.spec --noconfirm

      - name: Rename with platform + arch
        run: |
          arch=$(uname -m)
          name="GridFlow-Linux-${arch}"
          mv dist/GridFlow "dist/${name}"
          chmod +x "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridFlow-Linux-${{ runner.arch }}
          path: dist/GridFlow-Linux-*
